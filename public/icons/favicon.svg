<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Stylized Church Cross & Music Symbolism -->
  <!-- Cross vertical bar -->
  <rect x="238" y="110" width="36" height="290" rx="18" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Cross horizontal bar -->
  <rect x="156" y="190" width="200" height="36" rx="18" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Musical note accents -->
  <circle cx="340" cy="350" r="32" fill="#fbbf24" />
  <rect x="360" y="240" width="12" height="110" rx="6" fill="#fbbf24" />
  <path d="M 372 240 Q 400 245 408 275 Q 400 270 372 260 Z" fill="#fbbf24" />

  <circle cx="172" cy="365" r="26" fill="#38bdf8" opacity="0.85" />
  <rect x="190" y="275" width="10" height="90" rx="5" fill="#38bdf8" opacity="0.85" />
  <path d="M 200 275 Q 224 280 230 305 Q 224 300 200 292 Z" fill="#38bdf8" opacity="0.85" />
</svg>
