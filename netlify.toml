[build]
  command = "npm run build"
  publish = "dist"

# Route admin.bjcchurch.com directly to admin.html
[[redirects]]
  from = "https://admin.bjcchurch.com/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "https://admin.bjcchurch.com"
  to = "/admin.html"
  status = 200

# Route /admin to admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Fallback for main member application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
